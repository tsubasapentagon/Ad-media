name: PV情報ローカル確認用CSV
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-pv-local.yml"
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: python -m pip install --requirement etl/requirements.txt
      - name: PV情報を取得
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          PYTHONPATH=etl python - <<'PY'
          import csv
          from google_sources import spread_init, get_ga4
          from pv import load_all_pv_records, OUTPUT_COLUMNS

          rows = load_all_pv_records(spread_init, get_ga4, "2026-07-01", "2026-08-20")
          with open("pv_info.csv", "w", newline="", encoding="utf-8-sig") as file:
              writer = csv.DictWriter(file, fieldnames=OUTPUT_COLUMNS)
              writer.writeheader()
              writer.writerows(rows)
          print(f"PV情報: {len(rows)}件")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pv-info-2026-07-01_2026-08-20
          path: pv_info.csv
          retention-days: 7
