name: 広告データ更新
on:
  # 集計処理を変更したときは、その変更を使って直ちに実データ検証する。
  push:
    branches: [main]
    paths:
      - "etl/**"
      - "supabase/**"
      - ".github/workflows/daily-sync.yml"
  schedule:
    - cron: "0 0 * * *" # 09:00 JST
  workflow_dispatch:
    inputs:
      sync_targets:
        description: "更新対象（all または ad_master,pv,clicks,cv）"
        required: true
        default: "all"
        type: string
      start_date:
        description: "開始日（未指定なら先月1日）"
        required: false
        type: string
      end_date:
        description: "終了日（未指定なら昨日）"
        required: false
        type: string
concurrency:
  group: ad-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - name: Google API接続を準備
        run: python -m pip install --requirement etl/requirements.txt
      - name: 集計ルールを検証
        run: python -m unittest discover -s etl -p 'test_*.py'
      - name: データを差分更新
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SYNC_START_DATE: ${{ inputs.start_date }}
          SYNC_END_DATE: ${{ inputs.end_date }}
          SYNC_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'schedule' }}
          SYNC_TARGETS: ${{ inputs.sync_targets || 'all' }}
        run: python etl/sync.py
